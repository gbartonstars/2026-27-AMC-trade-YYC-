<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STAR 1 Shift Trade Portal</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB3EuJcuoyCAc43Xvuv8G7M4o8_BgLeeTQ",
      authDomain: "star1-schedule.firebaseapp.com",
      databaseURL: "https://star1-schedule-default-rtdb.firebaseio.com",
      projectId: "star1-schedule",
      storageBucket: "star1-schedule.firebasestorage.app",
      messagingSenderId: "892421370116",
      appId: "1:892421370116:web:30b705b567fc02b82fe051"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    .tab-buttons {
      display: flex;
      gap: 0;
      margin: 20px 0;
      border-bottom: 1px solid #ddd;
    }
    
    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: bold;
      color: #666;
      transition: all 0.3s;
    }
    
    .tab-btn:hover {
      color: #2d8a8c;
    }
    
    #calendarSection {
      margin-top: 20px;
    }
    
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .calendar-header button {
      padding: 8px 16px;
      background-color: #2d8a8c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    
    #rosterCalendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      border: 1px solid #ddd;
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>STAR 1 Shift Trade Portal</h1>
      <p>Request, Approve & Manage Shift Trades</p>
    </header>

    <section class="staff-selection">
      <label for="staffSelect">Select Your Name</label>
      <select id="staffSelect">
        <option value="">Choose your name...</option>
        <optgroup label="Paramedics">
          <option value="Greg Barton">Greg Barton</option>
          <option value="Scott McTaggart">Scott McTaggart</option>
          <option value="Dave Allison">Dave Allison</option>
          <option value="Mackenzie Wardle">Mackenzie Wardle</option>
          <option value="Chad Hegge">Chad Hegge</option>
          <option value="Ken King">Ken King</option>
          <option value="John Doyle">John Doyle</option>
          <option value="Bob Odney">Bob Odney</option>
        </optgroup>
        <optgroup label="Nurses">
          <option value="Graham Newton">Graham Newton</option>
          <option value="Stuart Grant">Stuart Grant</option>
          <option value="Kellie Ann Vogelaar">Kellie Ann Vogelaar</option>
          <option value="Michelle Sexsmith">Michelle Sexsmith</option>
          <option value="Carolyn Hogan">Carolyn Hogan</option>
          <option value="Kris Austin">Kris Austin</option>
          <option value="Flo Butler">Flo Butler</option>
          <option value="Jodi Scott">Jodi Scott</option>
          <option value="Janice Kirkham">Janice Kirkham</option>
        </optgroup>
      </select>
    </section>

    <!-- Tab navigation -->
    <div class="tab-buttons">
      <button id="shiftsTab" class="tab-btn" style="border-bottom: 3px solid #2d8a8c;">My Shifts</button>
      <button id="calendarTab" class="tab-btn">Calendar View</button>
      <button id="inboxTab" class="tab-btn">📬 Trade Inbox</button>
    </div>

    <!-- Shifts List View -->
    <section id="shiftsSection" style="display:none;">
      <h2 id="shiftsTitle"></h2>
      <div id="shiftsList" class="shifts-list"></div>
    </section>

    <!-- Calendar View -->
    <section id="calendarSection" style="display:none;">
      <div class="calendar-header">
        <button id="prevMonth">← Previous</button>
        <h2 id="currentMonth"></h2>
        <button id="nextMonth">Next →</button>
      </div>
      <div id="rosterCalendar"></div>
      <p style="margin-top: 15px; font-size: 12px; color: #666;">
        <strong>Legend:</strong> 🚑 = Paramedic | ⚕️ = Nurse | 🌙 = Night Shift | 
        <span style="background-color: #90EE90; padding: 2px 6px; border-radius: 3px;">Green = Your Shift</span>
      </p>
    </section>

    <!-- Trade Inbox -->
    <section id="inboxSection" style="display:none;">
      <h2>Trade Requests</h2>
      <div id="inboxList"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
